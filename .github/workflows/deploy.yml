name: Deploy to Cloudflare

on:
  push:
    branches: [master]
  workflow_dispatch:
  # The plugin pages are built from github.com/larvyn/plugins: rebuild so a
  # new or updated plugin shows up within a few hours.
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
